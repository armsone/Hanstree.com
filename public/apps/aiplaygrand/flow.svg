<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="853" viewBox="0 0 1280 853" role="img" aria-labelledby="title desc"><title id="title">AIplaygrand 함께 배우는 순서</title><desc id="desc">질문을 만들고 공식 웹 또는 CLI에서 직접 실습한 뒤 배운 점을 암호화 보관함에 기록하는 흐름. 앱 스크린샷이 아닌 사용 흐름도.</desc><rect width="1280" height="853" fill="#eef4f1"/><g font-family="sans-serif" fill="#173f38"><text x="90" y="135" font-size="26" letter-spacing="4">AIPLAYGRAND · 사용 흐름도</text><text x="90" y="240" font-size="64" font-weight="700">함께 배우고, 이어가요.</text><g fill="#fff"><rect x="90" y="330" width="310" height="230" rx="24"/><rect x="485" y="330" width="310" height="230" rx="24"/><rect x="880" y="330" width="310" height="230" rx="24"/></g><g font-size="30" font-weight="700"><text x="125" y="390">01 질문하기</text><text x="520" y="390">02 직접 실습</text><text x="915" y="390">03 기록하기</text></g><g font-size="23"><text x="125" y="460">팀원과 미션 선택</text><text x="520" y="460">공식 웹 · CLI</text><text x="915" y="460">답과 배운 점 저장</text><text x="125" y="502">Claude · Gemini · Codex</text><text x="520" y="502">질문 복사 후 전송</text><text x="915" y="502">USB 암호화 보관함</text></g><g font-size="42"><text x="425" y="456">→</text><text x="820" y="456">→</text></g><text x="90" y="675" font-size="28">Windows 0.3.0 · 공개 테스트 버전</text><text x="90" y="725" font-size="23">로그인 이동은 재인증이 필요할 수 있습니다.</text></g></svg>
